<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密管理后台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f5f6fa; padding:20px; }
.login-box { max-width:400px; margin:80px auto; background:#fff; border-radius:12px; padding:32px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
.login-box h2 { text-align:center; margin-bottom:20px; font-size:20px; }
.login-box input { width:100%; padding:12px; border:1.5px solid #e0e0e0; border-radius:8px; font-size:15px; margin-bottom:12px; }
.login-box button { width:100%; padding:12px; background:#26b887; color:#fff; border:none; border-radius:8px; font-size:15px; cursor:pointer; }
.login-box .err { color:#e74c3c; font-size:13px; text-align:center; }
.admin-panel { max-width:1000px; margin:0 auto; display:none; }
.admin-panel h1 { font-size:22px; margin-bottom:20px; }
.card { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
.card h3 { font-size:16px; margin-bottom:14px; }
.gen-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.gen-row select, .gen-row input { padding:10px 12px; border:1.5px solid #e0e0e0; border-radius:8px; font-size:14px; }
.gen-row button { padding:10px 20px; background:#26b887; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:10px 6px; text-align:left; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
th { color:#999; font-weight:500; white-space:nowrap; }
.badge { padding:2px 8px; border-radius:10px; font-size:11px; }
.badge-active { background:#e8f8f0; color:#26b887; }
.badge-expired { background:#fde8e8; color:#e74c3c; }
.badge-revoked { background:#eee; color:#999; }
.badge-unused { background:#fff8e1; color:#f57c00; }
.btn { padding:4px 8px; border:none; border-radius:5px; font-size:12px; cursor:pointer; margin:1px; }
.btn-revoke { background:#e74c3c; color:#fff; }
.btn-reactivate { background:#3b82f6; color:#fff; }
.btn-copy { background:#e8f8f0; color:#26b887; border:1px solid #26b887; }
.key-text { font-family:monospace; font-size:12px; }
.remaining { font-size:11px; color:#999; }
.dur-adjust { display:flex; gap:4px; align-items:center; }
.dur-adjust input { width:60px; padding:4px; border:1px solid #ddd; border-radius:4px; font-size:12px; text-align:center; }
.dur-adjust button { padding:4px 8px; font-size:11px; border:none; border-radius:4px; cursor:pointer; }
.note-input { width:100%; padding:4px 6px; border:1px solid #e0e0e0; border-radius:4px; font-size:12px; }
.dur-text { font-size:12px; color:#555; }
.copy-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:8px 20px; border-radius:8px; font-size:14px; display:none; }
</style>
</head>
<body>
<div id="loginView" class="login-box">
  <h2>卡密管理后台</h2>
  <input type="email" id="adminEmail" placeholder="管理员邮箱">
  <input type="password" id="adminPwd" placeholder="请输入密码">
  <button onclick="login()">登录</button>
  <p class="err" id="loginErr"></p>
</div>
<div id="adminView" class="admin-panel">
  <h1>卡密管理 <button onclick="logout()" style="float:right;font-size:13px;padding:6px 16px;background:#999;">退出</button></h1>
  <div class="card">
    <h3>生成新卡密</h3>
    <div class="gen-row">
      <select id="durSelect">
        <option value="-1">永久</option>
        <option value="1">1小时</option>
        <option value="5" selected>5小时</option>
        <option value="24">24小时</option>
        <option value="72">3天</option>
        <option value="168">7天</option>
      </select>
      <button onclick="genKey()">生成卡密</button>
      <span id="genResult" style="font-size:14px;color:#26b887;"></span>
    </div>
  </div>
  <div class="card">
    <h3>卡密列表 (<span id="keyCount">0</span>)</h3>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>卡密</th><th>时长</th><th>状态</th><th>剩余</th><th>调时长</th><th>备注</th><th>操作</th></tr></thead>
      <tbody id="keyTable"></tbody>
    </table>
    </div>
  </div>
  <div class="card">
    <h3>学籍内容编辑</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <input id="p_name" placeholder="姓名" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_gender" placeholder="性别" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_birth" placeholder="出生日期" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_school" placeholder="学校名称" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_major" placeholder="专业" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_nation" placeholder="民族" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_id" placeholder="证件号码" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_period" placeholder="学制" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_etype" placeholder="学历类别" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_campus" placeholder="分院" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_dept" placeholder="系所" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_class" placeholder="班级" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_sid" placeholder="学号" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_edate" placeholder="入学日期" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_status" placeholder="学籍状态" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
      <input id="p_gdate" placeholder="预计毕业日期" style="padding:8px;border:1px solid #e0e0e0;border-radius:6px;">
    </div>
    <div style="margin-top:12px;display:flex;gap:10px;">
      <button onclick="loadProfile()" style="padding:8px 16px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;">读取当前内容</button>
      <button onclick="saveProfile()" style="padding:8px 16px;background:#26b887;color:#fff;border:none;border-radius:6px;cursor:pointer;">保存</button>
    </div>
  </div>
</div>
<div class="copy-toast" id="copyToast">已复制</div>
<script>
const SUPABASE_URL = 'https://savncntnmafnmobtjrof.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhdm5jbnRubWFmbm1vYnRqcm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MDc5MDMsImV4cCI6MjEwNzI4MzkwM30.fMjmk2MtuzqvcNv3X3vp2eLjydzZ8nmpRrCJiGOSeAw';
let authToken = localStorage.getItem('admin_token') || '';
let authEmail = localStorage.getItem('admin_email') || '';

function authHeaders() {
  return {
    'apikey': ANON_KEY,
    'Authorization': 'Bearer ' + authToken,
    'Content-Type': 'application/json'
  };
}

async function login() {
  const email = document.getElementById('adminEmail').value.trim();
  const pwd = document.getElementById('adminPwd').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'apikey': ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password: pwd })
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = '登录失败：' + (data.error_description || data.msg || '账号或密码错误');
      return;
    }
    authToken = data.access_token;
    authEmail = email;
    localStorage.setItem('admin_token', authToken);
    localStorage.setItem('admin_email', authEmail);
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('adminView').style.display = 'block';
    loadKeys();
  } catch (e) {
    errEl.textContent = '网络错误：' + e.message;
  }
}

function logout() {
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_email');
  location.reload();
}

document.getElementById('adminPwd').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
document.getElementById('adminEmail').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

async function genKey() {
  const dur = parseInt(document.getElementById('durSelect').value);
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr = new Uint32Array(12);
  crypto.getRandomValues(arr);
  let k = '';
  for (let i = 0; i < 12; i++) {
    if (i > 0 && i % 4 === 0) k += '-';
    k += chars[arr[i] % chars.length];
  }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/keys`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ key: k, duration_hours: dur })
    });
    if (!res.ok) {
      const err = await res.text();
      alert('生成失败：' + err);
      return;
    }
    document.getElementById('genResult').textContent = '已生成: ' + k;
    loadKeys();
  } catch (e) {
    alert('网络错误：' + e.message);
  }
}

function fmtRemaining(ms) {
  if (ms <= 0) return '已到期';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  if (h >= 24) return Math.floor(h/24) + '天' + (h%24) + '时';
  return h + '时' + m + '分';
}

function copyKey(key) {
  navigator.clipboard.writeText(key).then(() => {
    const t = document.getElementById('copyToast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 1500);
  });
}

async function loadKeys() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/keys?select=*&order=created_at.desc`, {
      headers: authHeaders()
    });
    if (!res.ok) {
      const err = await res.text();
      alert('加载失败：' + err);
      return;
    }
    const data = await res.json();
    document.getElementById('keyCount').textContent = data.length;
    const tbody = document.getElementById('keyTable');
    tbody.innerHTML = '';
    data.forEach(k => {
      let status, badge, remaining = '-';
      if (k.is_revoked) { status = '已停用'; badge = 'badge-revoked'; }
      else if (!k.device_id) { status = '未使用'; badge = 'badge-unused'; }
      else if (k.duration_hours !== -1 && k.activated_at) {
        const expire = new Date(k.activated_at).getTime() + k.duration_hours * 3600 * 1000;
        const left = expire - Date.now();
        if (left <= 0) { status = '已过期'; badge = 'badge-expired'; }
        else { status = '使用中'; badge = 'badge-active'; remaining = fmtRemaining(left); }
      } else { status = '使用中'; badge = 'badge-active'; remaining = '永久'; }
      const isPerm = k.duration_hours === -1;
      const durText = isPerm ? '永久' : k.duration_hours + '小时';
      const note = k.note || '';
      let durHtml = '';
      if (!k.is_revoked && !isPerm && k.device_id) {
        durHtml = `<div class="dur-adjust">
          <input type="number" id="hours_${k.key}" placeholder="小时">
          <button style="background:#26b887;color:#fff" onclick="adjustDur('${k.key}','add')">+</button>
          <button style="background:#f57c00;color:#fff" onclick="adjustDur('${k.key}','sub')">-</button>
        </div>`;
      } else {
        durHtml = `<span class="dur-text">${durText}</span>`;
      }
      let actions = `<button class="btn btn-copy" onclick="copyKey('${k.key}')">复制</button>`;
      if (!k.is_revoked) {
        actions += `<button class="btn btn-revoke" onclick="revokeKey('${k.key}')">停用</button>`;
      } else {
        actions += `<button class="btn btn-reactivate" onclick="reactivateKey('${k.key}')">恢复</button>`;
      }
      tbody.innerHTML += `<tr>
        <td class="key-text">${k.key}</td>
        <td><span class="dur-text">${durText}</span></td>
        <td><span class="badge ${badge}">${status}</span></td>
        <td class="remaining">${remaining}</td>
        <td>${durHtml}</td>
        <td><input class="note-input" id="note_${k.key}" value="${note}" placeholder="备注..." onchange="saveNote('${k.key}', this.value)"></td>
        <td>${actions}</td>
      </tr>`;
    });
  } catch (e) {
    alert('网络错误：' + e.message);
  }
}

async function adjustDur(key, op) {
  const input = document.getElementById('hours_' + key);
  const hours = parseFloat(input.value);
  if (!hours || hours <= 0) { alert('请输入小时数'); return; }
  const delta = op === 'add' ? hours : -hours;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${encodeURIComponent(key)}&select=duration_hours`, {
      headers: authHeaders()
    });
    const data = await res.json();
    if (!data.length) { alert('未找到卡密'); return; }
    let newDur = data[0].duration_hours + delta;
    if (newDur < 1) newDur = 1;
    await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${encodeURIComponent(key)}`, {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify({ duration_hours: newDur })
    });
    input.value = '';
    loadKeys();
  } catch (e) {
    alert('错误：' + e.message);
  }
}

async function saveNote(key, note) {
  await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${encodeURIComponent(key)}`, {
    method: 'PATCH',
    headers: authHeaders(),
    body: JSON.stringify({ note })
  });
}

async function revokeKey(key) {
  if (!confirm('确定停用 ' + key + ' ?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${encodeURIComponent(key)}`, {
    method: 'PATCH',
    headers: authHeaders(),
    body: JSON.stringify({ is_revoked: true })
  });
  loadKeys();
}

async function reactivateKey(key) {
  if (!confirm('恢复 ' + key + ' ? 将清除设备绑定和激活时间')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${encodeURIComponent(key)}`, {
    method: 'PATCH',
    headers: authHeaders(),
    body: JSON.stringify({ is_revoked: false, device_id: null, activated_at: null })
  });
  loadKeys();
}

// 页面加载时如果有 token 自动登录
if (authToken) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminView').style.display = 'block';
  loadKeys();
}

async function loadProfile() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/student_profile?id=eq.1&select=*`, {
      headers: authHeaders()
    });
    if (!res.ok) { alert('读取失败：' + await res.text()); return; }
    const data = await res.json();
    if (!data.length) { alert('无数据'); return; }
    const p = data[0];
    document.getElementById('p_name').value = p.name || '';
    document.getElementById('p_gender').value = p.gender || '';
    document.getElementById('p_birth').value = p.birth_date || '';
    document.getElementById('p_school').value = p.school || '';
    document.getElementById('p_major').value = p.major || '';
    document.getElementById('p_nation').value = p.nation || '';
    document.getElementById('p_id').value = p.id_number || '';
    document.getElementById('p_period').value = p.study_period || '';
    document.getElementById('p_etype').value = p.education_type || '';
    document.getElementById('p_campus').value = p.campus || '';
    document.getElementById('p_dept').value = p.department || '';
    document.getElementById('p_class').value = p.class_name || '';
    document.getElementById('p_sid').value = p.student_id || '';
    document.getElementById('p_edate').value = p.enrollment_date || '';
    document.getElementById('p_status').value = p.status || '';
    document.getElementById('p_gdate').value = p.graduation_date || '';
  } catch (e) {
    alert('错误：' + e.message);
  }
}

async function saveProfile() {
  const fields = {
    name: document.getElementById('p_name').value,
    gender: document.getElementById('p_gender').value,
    birth_date: document.getElementById('p_birth').value,
    school: document.getElementById('p_school').value,
    major: document.getElementById('p_major').value,
    nation: document.getElementById('p_nation').value,
    id_number: document.getElementById('p_id').value,
    study_period: document.getElementById('p_period').value,
    education_type: document.getElementById('p_etype').value,
    campus: document.getElementById('p_campus').value,
    department: document.getElementById('p_dept').value,
    class_name: document.getElementById('p_class').value,
    student_id: document.getElementById('p_sid').value,
    enrollment_date: document.getElementById('p_edate').value,
    status: document.getElementById('p_status').value,
    graduation_date: document.getElementById('p_gdate').value
  };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/student_profile?id=eq.1`, {
      method: 'PATCH',
      headers: authHeaders(),
      body: JSON.stringify(fields)
    });
    if (res.ok) { alert('已保存'); } else { alert('保存失败：' + await res.text()); }
  } catch (e) {
    alert('网络错误：' + e.message);
  }
}
</script>
</body>
</html>
